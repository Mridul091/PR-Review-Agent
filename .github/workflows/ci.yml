name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      LLM_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src/ tests/ evals/

      - name: Format check
        run: uv run ruff format --check src/ tests/ evals/

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest tests/ -q --cov=src --cov=evals --cov-report=term-missing

      - name: Eval harness smoke run (fake provider)
        run: uv run python -m evals.run --provider fake --split all --out "$RUNNER_TEMP/evals"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
